[versions]
agp = "9.1.1"
cameraCamera2 = "1.4.2"
coreKtx = "1.19.0"
datastorePreferences = "1.1.2"
glide = "4.16.0"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
appcompat = "1.7.0"
